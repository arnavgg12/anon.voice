<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anon.voice — talk to a stranger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>anon.voice</h1>
    <p class="tagline">Talk to a stranger. No login. No history.</p>
  </header>

  <section class="orb-wrap">
    <div id="orb" class="orb idle"></div>
    <p id="status" class="status">Click Start to find someone.</p>
  </section>

  <section class="controls">
    <button id="toggle" class="primary">Start</button>
    <button id="mute" disabled>Mute</button>
    <button id="skip" disabled>Skip</button>
  </section>

  <section id="chat" class="chat hidden">
    <div class="tabs">
      <button class="tab active" data-tab="chat">💬 Chat</button>
      <button class="tab" data-tab="mines">💣 Mines</button>
      <button class="tab" data-tab="sudoku">🔢 Sudoku</button>
    </div>

    <div class="tab-panel" data-panel="chat">
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="Type a message…" maxlength="500" disabled>
        <button id="chat-send" type="submit" disabled>Send</button>
      </form>
    </div>

    <div class="tab-panel hidden" data-panel="mines">
      <div class="game-bar">
        <span id="game-status" class="game-status">Click "New game" to start.</span>
        <button id="game-new" class="primary" disabled>New game</button>
      </div>
      <div id="board" class="board"></div>
    </div>

    <div class="tab-panel hidden" data-panel="sudoku">
      <div class="game-bar">
        <span id="sudoku-status" class="game-status">Click "New game" to start.</span>
        <button id="sudoku-new" class="primary" disabled>New game</button>
      </div>
      <div id="sudoku-grid" class="sudoku-grid"></div>
      <div class="sudoku-pad">
        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-value="0" class="clear">⌫</button>
      </div>
    </div>
  </section>

  <footer>
    <p>Be kind. Audio is peer-to-peer; nothing is recorded.</p>
  </footer>

  <audio id="remote-audio" autoplay playsinline></audio>
</main>
<div class="watermark">AG</div>
<script src="/socket.io/socket.io.js"></script>
<script src="minesweeper.js"></script>
<script src="sudoku.js"></script>
<script src="app.js"></script>
</body>
</html>
