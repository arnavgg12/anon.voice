<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anon.voice — talk to a stranger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>anon.voice</h1>
    <p class="tagline">Talk to a stranger. No login. No history.</p>
  </header>

  <section class="orb-wrap">
    <div id="orb" class="orb idle"></div>
    <p id="status" class="status" role="status" aria-live="polite">Pick a mode to begin.</p>
  </section>

  <section class="controls">
    <button id="toggle" class="primary">🎲 Random stranger</button>
    <button id="join-lounge" class="primary">🛋️ Lounge</button>
    <button id="join-chill" class="primary">🌙 Chill</button>
    <button id="mute" class="hidden" disabled>Mute</button>
    <button id="skip" class="hidden" disabled>Skip</button>
  </section>

  <div id="participants" class="participants hidden" aria-label="Participants"></div>

  <section id="chat" class="chat hidden">
    <div class="tabs">
      <button class="tab active" data-tab="chat" title="Chat" aria-label="Chat" data-label="Chat">💬</button>
      <button class="tab" data-tab="mines" title="Minesweeper" aria-label="Minesweeper" data-label="Mines">💣</button>
      <button class="tab" data-tab="sudoku" title="Sudoku" aria-label="Sudoku" data-label="Sudoku">🔢</button>
      <button class="tab" data-tab="c4" title="Connect 4" aria-label="Connect 4" data-label="C4">🔴</button>
      <button class="tab" data-tab="ttt" title="Tic-Tac-Toe" aria-label="Tic-Tac-Toe" data-label="TTT">❌</button>
      <button class="tab" data-tab="db" title="Dots and Boxes" aria-label="Dots and Boxes" data-label="Boxes">📦</button>
    </div>

    <div class="tab-panel" data-panel="chat">
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="Type a message…" maxlength="500" disabled>
        <button id="chat-send" type="submit" disabled>Send</button>
      </form>
    </div>

    <div class="tab-panel hidden" data-panel="mines">
      <div class="game-bar">
        <span id="game-status" class="game-status">Click "New game" to start.</span>
        <button id="game-new" class="primary" disabled>New game</button>
      </div>
      <div id="board" class="board"></div>
    </div>

    <div class="tab-panel hidden" data-panel="sudoku">
      <div class="game-bar">
        <span id="sudoku-status" class="game-status">Click "New game" to start.</span>
        <button id="sudoku-new" class="primary" disabled>New game</button>
      </div>
      <div id="sudoku-grid" class="sudoku-grid"></div>
      <div class="sudoku-pad">
        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-value="0" class="clear">⌫</button>
      </div>
    </div>

    <div class="tab-panel hidden" data-panel="c4">
      <div class="game-bar">
        <span id="c4-status" class="game-status">Click "New game" to start.</span>
        <button id="c4-new" class="primary" disabled>New game</button>
      </div>
      <div id="c4-grid" class="c4-grid"></div>
    </div>

    <div class="tab-panel hidden" data-panel="ttt">
      <div class="game-bar">
        <span id="ttt-status" class="game-status">Click "New game" to start.</span>
        <button id="ttt-new" class="primary" disabled>New game</button>
      </div>
      <div id="ttt-grid" class="ttt-grid"></div>
    </div>

    <div class="tab-panel hidden" data-panel="db">
      <div class="game-bar">
        <span id="db-status" class="game-status">Click "New game" to start.</span>
        <button id="db-new" class="primary" disabled>New game</button>
      </div>
      <div id="db-board" class="db-board"></div>
    </div>
  </section>

  <footer>
    <p>Be kind. Audio is peer-to-peer; nothing is recorded.</p>
  </footer>

  <audio id="remote-audio" autoplay playsinline></audio>
  <div id="peer-audios" aria-hidden="true"></div>
</main>
<div class="watermark">AG</div>
<script src="/socket.io/socket.io.js"></script>
<script src="minesweeper.js"></script>
<script src="sudoku.js"></script>
<script src="connect4.js"></script>
<script src="tictactoe.js"></script>
<script src="dotsboxes.js"></script>
<script src="app.js"></script>
</body>
</html>
